<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Cobalt İndirici</title>
    <link rel="icon" href="https://raw.githubusercontent.com/cemalevli38/My_Site_Repo/refs/heads/main/youtube/noads.ico" type="image/x-icon">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 600px;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: #38bdf8;
            text-align: center;
        }
        p.subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        .input-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #cbd5e1;
        }
        input[type="text"] {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0ea5e9;
        }
        .result-box {
            margin-top: 2rem;
            background: #0f172a;
            padding: 1rem;
            border-radius: 0.5rem;
            border: 1px solid #334155;
            display: none;
        }
        .result-box.active {
            display: block;
        }
        .result-title {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 0.5rem;
        }
        .result-content {
            word-break: break-all;
            color: #4ade80;
            font-family: monospace;
            font-size: 1.05rem;
            margin-bottom: 0.75rem;
        }
        .copy-btn {
            background: #334155;
            color: #fff;
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
            width: auto;
        }
        .copy-btn:hover {
            background: #475569;
        }
        .redirect-msg {
            margin-top: 1rem;
            text-align: center;
            color: #38bdf8;
            font-size: 0.9rem;
            display: none;
        }
        .redirect-msg.active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Cobalt İndirici API</h1>
        <p class="subtitle">YouTube linkini yapıştır, Cobalt üzerinden direkt indirme bağlantısını kap!</p>
        
        <div class="input-group">
            <label for="urlInput">YouTube Linkini Yapıştır:</label>
            <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=...">
        </div>
        
        <button id="convertBtn">Cobalt ile Çöz ve İndir</button>

        <div class="result-box" id="resultBox">
            <div class="result-title" id="resultTitle">İndirme Bağlantısı:</div>
            <div class="result-content" id="resultText">Yükleniyor... ⏳</div>
            <button class="copy-btn" id="copyBtn">Kopyala</button>
            <div class="redirect-msg" id="redirectMsg">Yönlendiriliyorsun kardo... 🚀</div>
        </div>
    </div>

    <script>
        async function fetchCobalt(targetUrl) {
            showResult("İşleniyor, beklemede kal kardo... 🔄");
            
            try {
                // Doğru JSON endpoint adresi (/api/json)
                const response = await fetch("https://api.cobalt.tools/api/json", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({
                        url: targetUrl
                    })
                });

                const data = await response.json();

                if (data.status === "redirect" || data.status === "stream") {
                    const downloadUrl = data.url;
                    showResult(downloadUrl);
                    
                    document.getElementById('redirectMsg').classList.add('active');
                    setTimeout(() => {
                        window.location.href = downloadUrl;
                    }, 1500);
                } else if (data.status === "picker") {
                    const downloadUrl = data.picker[0].url;
                    showResult(downloadUrl);
                    
                    document.getElementById('redirectMsg').classList.add('active');
                    setTimeout(() => {
                        window.location.href = downloadUrl;
                    }, 1500);
                } else {
                    showResult("Hata: Video çözülemedi kardo! 💀");
                }
            } catch (err) {
                showResult("Bağlantı hatası oluştu bro! ⚠️");
            }
        }

        function handleUrlAction(targetUrl) {
            if (!targetUrl) return;
            fetchCobalt(targetUrl);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const queryUrl = urlParams.get('url') || urlParams.get('link');
            
            if (queryUrl) {
                document.getElementById('urlInput').value = queryUrl;
                handleUrlAction(queryUrl);
            }
        });

        document.getElementById('convertBtn').addEventListener('click', () => {
            const inputVal = document.getElementById('urlInput').value.trim();
            handleUrlAction(inputVal);
        });

        document.getElementById('urlInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const inputVal = document.getElementById('urlInput').value.trim();
                handleUrlAction(inputVal);
            }
        });

        function showResult(text) {
            const box = document.getElementById('resultBox');
            const textEl = document.getElementById('resultText');
            textEl.textContent = text;
            box.classList.add('active');
        }

        document.getElementById('copyBtn').addEventListener('click', () => {
            const textToCopy = document.getElementById('resultText').textContent;
            navigator.clipboard.writeText(textToCopy).then(() => {
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.textContent = 'Kopyalandı! 🔥';
                setTimeout(() => {
                    copyBtn.textContent = 'Kopyala';
                }, 2000);
            });
        });
    </script>
</body>
</html>
