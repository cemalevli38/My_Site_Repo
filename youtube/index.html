<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Link Temizleyici</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 600px;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: #38bdf8;
            text-align: center;
        }
        p.subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        .input-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #cbd5e1;
        }
        input[type="text"] {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0ea5e9;
        }
        .result-box {
            margin-top: 2rem;
            background: #0f172a;
            padding: 1rem;
            border-radius: 0.5rem;
            border: 1px solid #334155;
            display: none;
        }
        .result-box.active {
            display: block;
        }
        .result-title {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 0.5rem;
        }
        .result-content {
            word-break: break-all;
            color: #4ade80;
            font-family: monospace;
            font-size: 1.05rem;
            margin-bottom: 0.75rem;
        }
        .copy-btn {
            background: #334155;
            color: #fff;
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
            width: auto;
        }
        .copy-btn:hover {
            background: #475569;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>YouTube Link Dönüştürücü</h1>
        <p class="subtitle">İstediğin linki temizle veya URL parametresi olarak kullan!</p>
        
        <div class="input-group">
            <label for="urlInput">YouTube Linkini Yapıştır:</label>
            <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=... veya https://youtu.be/...">
        </div>
        
        <button id="convertBtn">Dönüştür ve Temizle</button>

        <div class="result-box" id="resultBox">
            <div class="result-title">Temizlenmiş Link:</div>
            <div class="result-content" id="resultText"></div>
            <button class="copy-btn" id="copyBtn">Kopyala</button>
        </div>
    </div>

    <script>
        // URL'den veya inputtan gelen veriyi işleme fonksiyonu
        function processUrl(rawUrl) {
            if (!rawUrl) return "";
            try {
                // Eğer tam URL girildiyse parse et
                const urlObj = new URL(rawUrl);
                
                // 1. Playlist kontrolü (skipvids altyapısı ile)
                if (urlObj.searchParams.has('list')) {
                    const listId = urlObj.searchParams.get('list');
                    return `https://skipvids.com/playlist?list=${listId}`;
                }
                
                // 2. Normal Video kontrolü (watch?v= veya youtu.be/)
                let videoId = "";
                if (urlObj.hostname.includes('youtu.be')) {
                    videoId = urlObj.pathname.slice(1);
                } else if (urlObj.searchParams.has('v')) {
                    videoId = urlObj.searchParams.get('v');
                }
                
                if (videoId) {
                    return `https://skipvids.com/watch?v=${videoId}&gl=TR`;
                }
            } catch (e) {
                // Eğer geçerli bir URL değilse düz metin veya parça olarak dönebilir
            }
            return rawUrl;
        }

        // Sayfa yüklendiğinde URL'deki query parametrelerini kontrol et (örn: ?url=...)
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const queryUrl = urlParams.get('url') || urlParams.get('link');
            
            if (queryUrl) {
                document.getElementById('urlInput').value = queryUrl;
                const cleaned = processUrl(queryUrl);
                showResult(cleaned);
            }
        });

        // Butona tıklandığında dönüştür
        document.getElementById('convertBtn').addEventListener('click', () => {
            const inputVal = document.getElementById('urlInput').value.trim();
            const cleaned = processUrl(inputVal);
            if (cleaned) {
                showResult(cleaned);
            }
        });

        function showResult(text) {
            const box = document.getElementById('resultBox');
            const textEl = document.getElementById('resultText');
            textEl.textContent = text;
            box.classList.add('active');
        }

        // Kopyalama butonu
        document.getElementById('copyBtn').addEventListener('click', () => {
            const textToCopy = document.getElementById('resultText').textContent;
            navigator.clipboard.writeText(textToCopy).then(() => {
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.textContent = 'Kopyalandı! 🔥';
                setTimeout(() => {
                    copyBtn.textContent = 'Kopyala';
                }, 2000);
            });
        });
    </script>
</body>
</html>
