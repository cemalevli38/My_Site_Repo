<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/cemalevli38/My_Site_Repo/refs/heads/main/cs16d/csico.ico">
    <title></title>
</head>
<body>
    <script>
        const jsonUrl = "https://raw.githubusercontent.com/cemalevli38/My_Site_Repo/main/games.json";

        async function redirectCS16() {
            try {
                const response = await fetch(jsonUrl);
                if (!response.ok) return;

                const data = await response.json();
                let downloadUrl = null;

                for (const release of data) {
                    if (release.assets && Array.isArray(release.assets)) {
                        const targetAsset = release.assets.find(asset => asset.name === "cs16.exe");
                        if (targetAsset && targetAsset.browser_download_url) {
                            downloadUrl = targetAsset.browser_download_url;
                            break;
                        }
                    }
                }

                if (downloadUrl) {
                    window.location.href = downloadUrl;
                }
            } catch (error) {
                console.error("Hata:", error);
            }
        }

        redirectCS16();
    </script>
</body>
</html>
