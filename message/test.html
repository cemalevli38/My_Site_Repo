<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Anlık Chat Pro</title>
    <link id="favicon" rel="icon" type="image/png" href="">
    <script>
        document.getElementById('favicon').href = "https://wsrv.nl/?url=https://github.com/cemalevli38.png&w=200&h=200&mask=circle&t=" + new Date().getTime();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at top left, #0f172a, #020617);
            --panel-bg: rgba(30, 41, 59, 0.6);
            --header-bg: rgba(15, 23, 42, 0.7);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --msg-other: rgba(51, 65, 85, 0.5);
            --msg-my: linear-gradient(135deg, rgba(2, 132, 199, 0.5), rgba(99, 102, 241, 0.5));
            --primary: #38bdf8;
            --input-bg: rgba(30, 41, 59, 0.7);
        }

        body.light-mode {
            --bg-gradient: linear-gradient(135deg, #e2e8f0, #f8fafc);
            --panel-bg: rgba(255, 255, 255, 0.85);
            --header-bg: rgba(241, 245, 249, 0.9);
            --text-main: #0f172a;
            --text-sub: #475569;
            --border-color: rgba(0, 0, 0, 0.1);
            --msg-other: rgba(226, 232, 240, 0.9);
            --msg-my: linear-gradient(135deg, #38bdf8, #818cf8);
            --primary: #0284c7;
            --input-bg: rgba(255, 255, 255, 0.9);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .chat-app {
            display: flex;
            width: 100%;
            max-width: 1100px;
            height: 90vh;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            position: relative;
        }

        /* Sidebar (Kanallar & Kullanıcılar) */
        .sidebar {
            width: 260px;
            background: rgba(15, 23, 42, 0.3);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 20px;
        }

        .sidebar h3 { font-size: 0.85rem; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }

        .channel-list, .user-list { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
        
        .channel-btn {
            padding: 10px 14px;
            border-radius: 10px;
            background: transparent;
            color: var(--text-main);
            border: none;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .channel-btn:hover, .channel-btn.active {
            background: rgba(56, 189, 248, 0.15);
            color: var(--primary);
            font-weight: 600;
        }

        .online-user-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            padding: 4px 0;
        }

        .avatar-img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #334155;
        }

        /* Main Chat Container */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-header {
            background: var(--header-bg);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .header-controls { display: flex; align-items: center; gap: 12px; }

        .btn-icon {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-icon:hover { background: rgba(255, 255, 255, 0.15); }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message-card {
            background: var(--msg-other);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 16px;
            border-bottom-left-radius: 2px;
            max-width: 75%;
            word-wrap: break-word;
            align-self: flex-start;
            position: relative;
            display: flex;
            gap: 10px;
        }

        .message-card.my-message {
            align-self: flex-end;
            border-radius: 16px;
            border-bottom-right-radius: 2px;
            background: var(--msg-my);
            flex-direction: row-reverse;
        }

        .msg-body { flex: 1; }

        .message-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            margin-bottom: 4px;
            gap: 10px;
        }

        .username { font-weight: 600; color: var(--primary); cursor: pointer; }
        .time { color: var(--text-sub); font-size: 0.7rem; }

        .quoted-reply {
            background: rgba(0, 0, 0, 0.2);
            border-left: 3px solid var(--primary);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-bottom: 6px;
            color: var(--text-sub);
        }

        .media-preview {
            max-width: 100%;
            max-height: 220px;
            border-radius: 8px;
            margin-top: 6px;
        }

        .media-iframe {
            width: 100%;
            height: 180px;
            border-radius: 8px;
            border: none;
            margin-top: 6px;
        }

        .reactions-bar {
            display: flex;
            gap: 4px;
            margin-top: 6px;
        }

        .react-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            border-radius: 12px;
            padding: 2px 6px;
            font-size: 0.75rem;
            cursor: pointer;
            color: var(--text-main);
        }

        .react-btn:hover { background: rgba(255, 255, 255, 0.2); }

        .typing-indicator {
            padding: 6px 20px;
            font-size: 0.8rem;
            color: var(--primary);
            font-style: italic;
            height: 24px;
        }

        /* Input Area */
        .chat-input-area {
            padding: 16px;
            background: var(--header-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .reply-preview-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.2);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
        }

        .input-row { display: flex; gap: 8px; align-items: center; position: relative; }

        input[type="text"] {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 12px;
            outline: none;
        }

        button.send-btn {
            background: linear-gradient(135deg, #0284c7, #4f46e5);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .emoji-picker-popover {
            position: absolute;
            bottom: 55px;
            right: 80px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .emoji-picker-popover span {
            font-size: 1.2rem;
            cursor: pointer;
            text-align: center;
            padding: 4px;
            border-radius: 6px;
        }

        .emoji-picker-popover span:hover { background: rgba(255,255,255,0.1); }

        .hidden { display: none !important; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="chat-app">
    <!-- Sol Panel: Odalar ve Aktif Kullanıcılar -->
    <div class="sidebar">
        <div>
            <h3>Odalar / Kanallar</h3>
            <div class="channel-list">
                <button class="channel-btn active" onclick="switchChannel('genel')"># Genel</button>
                <button class="channel-btn" onclick="switchChannel('yazilim')"># Yazılım</button>
                <button class="channel-btn" onclick="switchChannel('oyun')"># Oyun</button>
                <button class="channel-btn" onclick="switchChannel('muzik')"># Müzik</button>
            </div>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column;">
            <h3>Çevrimiçi (<span id="onlineCount">0</span>)</h3>
            <div class="user-list" id="onlineUserList"></div>
        </div>
    </div>

    <!-- Ana Sohbet Alanı -->
    <div class="chat-main">
        <div class="chat-header">
            <div>
                <h2 id="currentChannelTitle"># Genel</h2>
                <span style="font-size: 0.8rem; color: var(--text-sub);">İsim: <b id="displayUsername" onclick="changeUsername()" style="color:var(--primary); cursor:pointer;">...</b> (Tıkla Değiştir)</span>
            </div>
            <div class="header-controls">
                <button class="btn-icon" onclick="toggleMute()" id="muteBtn">🔊 Ses</button>
                <button class="btn-icon" onclick="toggleTheme()">🌓 Tema</button>
                <button class="btn-icon" onclick="clearLocalChat()">🧹 Temizle</button>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="typing-indicator" id="typingIndicator"></div>

        <div class="chat-input-area">
            <!-- Alıntı / Yanıt Paneli -->
            <div id="replyPreview" class="reply-preview-bar hidden">
                <span>Yanıtlanan: <i id="replyText">...</i></span>
                <span onclick="cancelReply()" style="cursor:pointer; color:#ef4444;">✕</span>
            </div>

            <!-- Emoji Seçici Popover -->
            <div id="emojiPicker" class="emoji-picker-popover hidden">
                <span onclick="addEmoji('😀')">😀</span><span onclick="addEmoji('😂')">😂</span>
                <span onclick="addEmoji('😍')">😍</span><span onclick="addEmoji('🔥')">🔥</span>
                <span onclick="addEmoji('👍')">👍</span><span onclick="addEmoji('❤️')">❤️</span>
                <span onclick="addEmoji('🎉')">🎉</span><span onclick="addEmoji('😎')">😎</span>
                <span onclick="addEmoji('🚀')">🚀</span><span onclick="addEmoji('💯')">💯</span>
                <span onclick="addEmoji('🙏')">🙏</span><span onclick="addEmoji('💩')">💩</span>
            </div>

            <div class="input-row">
                <button class="btn-icon" onclick="document.getElementById('fileInput').click()">📁</button>
                <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileUpload(event)">
                
                <input type="text" id="messageInput" placeholder="Mesaj yazın..." maxlength="300" disabled oninput="handleTyping()">
                
                <button class="btn-icon" onclick="toggleEmojiPicker()">😀</button>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>Gönder</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Firebase Konfigürasyonu
    const firebaseConfig = {
        apiKey: "AIzaSyDC5cTxGvJq4Cc3dlkcD-QYfdUQPOOo4E8",
        authDomain: "message-site-329ee.firebaseapp.com",
        databaseURL: "https://message-site-329ee-default-rtdb.firebaseio.com",
        projectId: "message-site-329ee",
        storageBucket: "message-site-329ee.firebasestorage.app",
        messagingSenderId: "417292887136",
        appId: "1:417292887136:web:72a0d823dfa12f4969cf05"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Değişkenler
    let currentChannel = "genel";
    let currentUsername = "";
    let replyToData = null;
    let isMuted = false;
    let lastMessageTime = 0;
    let typingTimeout = null;
    let unreadCount = 0;
    let isWindowFocused = true;

    const availableNames = ["Astra", "Blaze", "Cipher", "Drift", "Echo", "Falcon", "Ghost", "Hyper", "Nova", "Onyx", "Quantum", "Shadow", "Titan", "Vortex"];

    function getDeviceId() {
        let id = localStorage.getItem('chat_device_id');
        if (!id) {
            id = 'dev_' + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('chat_device_id', id);
        }
        return id;
    }

    const deviceId = getDeviceId();

    // Kullanıcı Başlatma
    async function initUser() {
        const snap = await db.ref(`device_users/${deviceId}`).once('value');
        if (snap.val()) {
            currentUsername = snap.val();
        } else {
            currentUsername = availableNames[Math.floor(Math.random() * availableNames.length)] + "_" + Math.floor(10 + Math.random() * 90);
            await db.ref(`device_users/${deviceId}`).set(currentUsername);
        }

        document.getElementById('displayUsername').innerText = currentUsername;
        document.getElementById('messageInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;

        setupPresence();
        listenChannel(currentChannel);
        listenTyping();
        requestNotificationPermission();
    }

    // Çevroniçi Durumu (Presence System)
    function setupPresence() {
        const myPresenceRef = db.ref(`online_users/${deviceId}`);
        const connectedRef = db.ref('.info/connected');

        connectedRef.on('value', (snap) => {
            if (snap.val() === true) {
                myPresenceRef.onDisconnect().remove();
                myPresenceRef.set({
                    username: currentUsername,
                    avatar: getAvatarUrl(currentUsername)
                });
            }
        });

        db.ref('online_users').on('value', (snap) => {
            const users = snap.val() || {};
            const listEl = document.getElementById('onlineUserList');
            listEl.innerHTML = '';
            const userArray = Object.values(users);
            document.getElementById('onlineCount').innerText = userArray.length;

            userArray.forEach(u => {
                const item = document.createElement('div');
                item.className = 'online-user-item';
                item.innerHTML = `<img src="${u.avatar}" class="avatar-img"> <span>${escapeHtml(u.username)}</span>`;
                listEl.appendChild(item);
            });
        });
    }

    function getAvatarUrl(name) {
        return `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(name)}`;
    }

    // Oda Değiştirme
    function switchChannel(channel) {
        currentChannel = channel;
        document.getElementById('currentChannelTitle').innerText = `# ${channel.toUpperCase()}`;
        document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('chatMessages').innerHTML = '';
        listenChannel(channel);
    }

    // Mesaj Dinleme
    function listenChannel(channel) {
        db.ref(`messages/${channel}`).off();
        db.ref(`messages/${channel}`).limitToLast(40).on('child_added', (snap) => {
            renderMessage(snap.key, snap.val());
        });

        // Reaksiyon değişikliklerini dinle
        db.ref(`messages/${channel}`).limitToLast(40).on('child_changed', (snap) => {
            const card = document.getElementById(`msg-${snap.key}`);
            if (card) {
                updateReactionsUI(card, snap.val().reactions || {});
            }
        });
    }

    // Mesaj Render Etme
    function renderMessage(msgId, data) {
        const chatContainer = document.getElementById('chatMessages');
        const card = document.createElement('div');
        const isMy = data.username === currentUsername;
        card.id = `msg-${msgId}`;
        card.className = `message-card ${isMy ? 'my-message' : ''}`;

        const timeStr = new Date(data.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        let replyHtml = '';
        if (data.replyTo) {
            replyHtml = `<div class="quoted-reply"><b>${escapeHtml(data.replyTo.username)}:</b> ${escapeHtml(data.replyTo.text)}</div>`;
        }

        let contentHtml = formatMessageContent(data.text);
        if (data.mediaUrl) {
            contentHtml += `<br><img src="${data.mediaUrl}" class="media-preview">`;
        }

        card.innerHTML = `
            <img src="${getAvatarUrl(data.username)}" class="avatar-img">
            <div class="msg-body">
                <div class="message-header">
                    <span class="username" onclick="setReply('${msgId}', '${escapeHtml(data.username)}', '${escapeHtml(data.text)}')">${escapeHtml(data.username)}</span>
                    <span class="time">${timeStr}</span>
                </div>
                ${replyHtml}
                <div class="message-text">${contentHtml}</div>
                <div class="reactions-bar" id="reacts-${msgId}">
                    <button class="react-btn" onclick="addReaction('${msgId}', '❤️')">❤️ <span class="count">0</span></button>
                    <button class="react-btn" onclick="addReaction('${msgId}', '👍')">👍 <span class="count">0</span></button>
                    <button class="react-btn" onclick="addReaction('${msgId}', '😂')">😂 <span class="count">0</span></button>
                </div>
            </div>
        `;

        chatContainer.appendChild(card);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        updateReactionsUI(card, data.reactions || {});

        if (!isMy) {
            playNotificationSound();
            showWebNotification(data.username, data.text);
            if (!isWindowFocused) {
                unreadCount++;
                document.title = `(${unreadCount}) Global Chat`;
            }
        }
    }

    // YouTube ve Link İçerik Formatlama
    function formatMessageContent(text) {
        let escaped = escapeHtml(text);
        const ytRegex = /(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]+)/;
        const match = text.match(ytRegex);

        if (match && match[1]) {
            escaped += `<br><iframe class="media-iframe" src="https://www.youtube.com/embed/${match[1]}" allowfullscreen></iframe>`;
        }
        return escaped;
    }

    // Mesaj Gönderme (Rate Limit & Spam Protection)
    function sendMessage(mediaUrl = null) {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();

        if (!text && !mediaUrl) return;

        // Rate Limit (2 saniye)
        const now = Date.now();
        if (now - lastMessageTime < 2000) {
            alert("Lütfen çok hızlı mesaj göndermeyin (2 sn bekleme süresi).");
            return;
        }
        lastMessageTime = now;

        const payload = {
            username: currentUsername,
            text: text,
            timestamp: firebase.database.ServerValue.TIMESTAMP
        };

        if (replyToData) {
            payload.replyTo = replyToData;
        }

        if (mediaUrl) {
            payload.mediaUrl = mediaUrl;
        }

        db.ref(`messages/${currentChannel}`).push(payload);

        input.value = '';
        cancelReply();
        stopTyping();
    }

    // Görsel Paylaşımı (Base64)
    function handleFileUpload(e) {
        const file = e.target.files[0];
        if (!file) return;

        if (file.size > 1024 * 1024) { // Max 1MB
            alert("Dosya boyutu çok büyük (Max: 1MB)");
            return;
        }

        const reader = new FileReader();
        reader.onload = function (evt) {
            sendMessage(evt.target.result);
        };
        reader.readAsDataURL(file);
    }

    // Reaksiyon Ekleme
    function addReaction(msgId, emoji) {
        const ref = db.ref(`messages/${currentChannel}/${msgId}/reactions/${emoji}/${deviceId}`);
        ref.once('value', snap => {
            if (snap.exists()) {
                ref.remove(); // Tepkiyi kaldır
            } else {
                ref.set(true); // Tepki ekle
            }
        });
    }

    function updateReactionsUI(card, reactions) {
        const buttons = card.querySelectorAll('.react-btn');
        buttons.forEach(btn => {
            const emoji = btn.innerText.split(' ')[0];
            const countSpan = btn.querySelector('.count');
            const userList = reactions[emoji] ? Object.keys(reactions[emoji]) : [];
            countSpan.innerText = userList.length;
            btn.style.opacity = userList.length > 0 ? "1" : "0.5";
        });
    }

    // Alıntı / Yanıt Sistemi
    function setReply(msgId, username, text) {
        replyToData = { msgId, username, text };
        document.getElementById('replyText').innerText = `${username}: ${text}`;
        document.getElementById('replyPreview').classList.remove('hidden');
    }

    function cancelReply() {
        replyToData = null;
        document.getElementById('replyPreview').classList.add('hidden');
    }

    // "Yazıyor..." Bildirimi
    function handleTyping() {
        db.ref(`typing/${currentChannel}/${deviceId}`).set(currentUsername);
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(stopTyping, 2000);
    }

    function stopTyping() {
        db.ref(`typing/${currentChannel}/${deviceId}`).remove();
    }

    function listenTyping() {
        db.ref(`typing/${currentChannel}`).on('value', snap => {
            const data = snap.val() || {};
            delete data[deviceId];
            const names = Object.values(data);
            const indicator = document.getElementById('typingIndicator');
            if (names.length > 0) {
                indicator.innerText = `${names.join(', ')} yazıyor...`;
            } else {
                indicator.innerText = '';
            }
        });
    }

    // İsim Değiştirme
    async function changeUsername() {
        const newName = prompt("Yeni kullanıcı adınızı girin:", currentUsername);
        if (newName && newName.trim().length >= 3) {
            currentUsername = newName.trim();
            await db.ref(`device_users/${deviceId}`).set(currentUsername);
            document.getElementById('displayUsername').innerText = currentUsername;
            setupPresence();
        }
    }

    // Emoji Paneli
    function toggleEmojiPicker() {
        document.getElementById('emojiPicker').classList.toggle('hidden');
    }

    function addEmoji(emoji) {
        const input = document.getElementById('messageInput');
        input.value += emoji;
        toggleEmojiPicker();
    }

    // Sesli Bildirim (Web Audio API)
    function playNotificationSound() {
        if (isMuted) return;
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.15);
        } catch (e) {}
    }

    function toggleMute() {
        isMuted = !isMuted;
        document.getElementById('muteBtn').innerText = isMuted ? "🔇 Sessiz" : "🔊 Ses";
    }

    // Masaüstü Bildirimleri
    function requestNotificationPermission() {
        if ("Notification" in window && Notification.permission !== "granted") {
            Notification.requestPermission();
        }
    }

    function showWebNotification(title, body) {
        if (!isWindowFocused && "Notification" in window && Notification.permission === "granted") {
            new Notification(title, { body: body, icon: getAvatarUrl(title) });
        }
    }

    // Tema & Yerel Temizleme
    function toggleTheme() {
        document.body.classList.toggle('light-mode');
    }

    function clearLocalChat() {
        document.getElementById('chatMessages').innerHTML = '';
    }

    // Sekme Odak Takibi
    window.onfocus = () => {
        isWindowFocused = true;
        unreadCount = 0;
        document.title = "Global Anlık Chat Pro";
    };
    window.onblur = () => { isWindowFocused = false; };

    // Enter ile gönderme
    document.getElementById('messageInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    window.onload = initUser;
</script>
</body>
</html>
