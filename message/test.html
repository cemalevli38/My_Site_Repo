<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Anlık Chat</title>
<link id="favicon" rel="icon" type="image/png" href="">
<script>document.getElementById('favicon').href="https://wsrv.nl/?url=https://github.com/cemalevli38.png&w=200&h=200&mask=circle&t="+Date.now();</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0f172a;--bg2:#020617;--panel:rgba(30,41,59,.55);--head:rgba(15,23,42,.65);--bd:rgba(255,255,255,.08);--tx:#f8fafc;--mut:#94a3b8;--card:rgba(51,65,85,.45);--acc:#38bdf8;--mine:linear-gradient(135deg,rgba(2,132,199,.45),rgba(99,102,241,.45));--inp:rgba(30,41,59,.8)}
[data-theme=light]{--bg1:#e0f2fe;--bg2:#eef2ff;--panel:rgba(255,255,255,.7);--head:rgba(255,255,255,.8);--bd:rgba(0,0,0,.1);--tx:#0f172a;--mut:#475569;--card:rgba(255,255,255,.85);--acc:#0284c7;--mine:linear-gradient(135deg,rgba(125,211,252,.65),rgba(165,180,252,.65));--inp:rgba(255,255,255,.95)}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
html,body{height:100%}
body{background:radial-gradient(circle at top left,var(--bg1),var(--bg2));color:var(--tx);display:flex;justify-content:center;align-items:center;padding:16px;overflow:hidden}
.app{position:relative;width:100%;max-width:980px;height:90vh;display:flex;background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.35);overflow:hidden}
.side{width:210px;flex:none;border-right:1px solid var(--bd);background:var(--head);display:flex;flex-direction:column;padding:14px;gap:6px;overflow-y:auto}
.side h4{font-size:.68rem;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin:10px 0 4px}
.chat{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.head{background:var(--head);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--bd)}
.head h2{font-size:1rem;font-weight:600;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.hl,.hr{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;background:#10b981;border-radius:50%;box-shadow:0 0 10px #10b981}
.badge{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--mut);background:var(--card);padding:4px 12px 4px 4px;border-radius:20px;border:1px solid var(--bd);cursor:pointer}
.badge img{width:26px;height:26px;border-radius:50%}
.badge span{color:var(--acc);font-weight:600}
button{background:linear-gradient(135deg,#0284c7,#4f46e5);color:#fff;border:none;padding:10px 20px;border-radius:12px;font-weight:600;font-size:.88rem;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:6px}
button:hover{transform:translateY(-1px);filter:brightness(1.1)}
button:disabled{opacity:.6;cursor:not-allowed}
.ib{background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:7px 10px;font-size:.95rem}
.room{background:transparent;color:var(--tx);justify-content:flex-start;padding:9px 12px;font-weight:500;width:100%}
.room.on{background:var(--mine);border:1px solid rgba(56,189,248,.3)}
.u{display:flex;align-items:center;gap:8px;font-size:.85rem;padding:3px 2px}
.u img{width:26px;height:26px;border-radius:50%}
.u i{width:8px;height:8px;background:#10b981;border-radius:50%;margin-left:auto}
.msgs{flex:1;padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.msgs::-webkit-scrollbar{width:6px}.msgs::-webkit-scrollbar-thumb{background:var(--bd);border-radius:10px}
.msg{display:flex;gap:8px;align-items:flex-end;animation:fi .25s ease-out}
.msg.mine{flex-direction:row-reverse}
.msg.flash .card{outline:2px solid var(--acc)}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.av{width:32px;height:32px;border-radius:50%;flex:none;background:#334155}
.card{position:relative;background:var(--card);border:1px solid var(--bd);padding:10px 14px;border-radius:16px;border-bottom-left-radius:4px;max-width:75%;word-wrap:break-word;overflow-wrap:anywhere}
.mine .card{background:var(--mine);border-bottom-left-radius:16px;border-bottom-right-radius:4px}
.mh{display:flex;justify-content:space-between;gap:12px;font-size:.74rem;margin-bottom:4px}
.un{color:var(--acc)}.tm{color:var(--mut);font-size:.68rem}
.mt{font-size:.92rem;line-height:1.5}
.mt a,.mt a:visited{color:var(--acc)}
.quote{font-size:.78rem;color:var(--mut);border-left:3px solid var(--acc);background:rgba(127,127,127,.12);padding:4px 8px;border-radius:6px;margin-bottom:6px;cursor:pointer}
.quote b{color:var(--acc);margin-right:4px}
.pimg{max-width:100%;max-height:260px;border-radius:10px;margin-top:8px;display:block}
.yt{width:100%;max-width:360px;aspect-ratio:16/9;border:0;border-radius:10px;margin-top:8px;display:block}
.lcard{display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px 10px;background:rgba(127,127,127,.14);border-radius:10px;text-decoration:none;color:var(--tx)}
.lcard img{width:28px;height:28px;border-radius:6px}.fi{font-size:1.4rem}
.lcard b{display:block;font-size:.82rem}.lcard small{color:var(--mut);font-size:.72rem}
.rx{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.rx:empty{display:none}
.chip{padding:2px 8px;font-size:.78rem;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px}
.chip.on{border-color:var(--acc);background:rgba(56,189,248,.2)}
.acts{position:absolute;top:-14px;right:8px;display:none;gap:4px}
.mine .acts{right:auto;left:8px}
.card:hover .acts,.acts:focus-within{display:flex}
@media(hover:none){.acts{display:flex;top:auto;bottom:-12px;opacity:.85}}
.acts .ib{padding:3px 7px;font-size:.8rem}
.rpop{position:absolute;top:100%;right:0;margin-top:4px;display:flex;gap:2px;background:var(--head);border:1px solid var(--bd);border-radius:12px;padding:4px;z-index:5}
.mine .rpop{right:auto;left:0}
.rpop button{background:none;padding:3px 5px;font-size:1.1rem}
.sub{min-height:20px;padding:2px 20px;font-size:.76rem;color:var(--mut);font-style:italic}
.rbar{display:none;align-items:center;justify-content:space-between;gap:8px;margin:0 16px;padding:6px 10px;font-size:.8rem;color:var(--mut);background:var(--card);border-left:3px solid var(--acc);border-radius:8px}
.rbar.on{display:flex}
.inbar{padding:12px 16px 16px;background:var(--head);border-top:1px solid var(--bd);display:flex;gap:8px;position:relative}
input{background:var(--inp);border:1px solid var(--bd);color:var(--tx);padding:11px 16px;border-radius:12px;font-size:.9rem;outline:none;min-width:0}
input:focus{border-color:var(--acc)}
#inp{flex:1}
.emo{display:none;position:absolute;bottom:64px;left:16px;width:288px;max-height:190px;overflow-y:auto;grid-template-columns:repeat(8,1fr);background:var(--head);border:1px solid var(--bd);border-radius:12px;padding:6px;z-index:6}
.emo.on{display:grid}
.emo button{background:none;padding:4px;font-size:1.2rem}
.toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:8px 16px;border-radius:20px;font-size:.82rem;opacity:0;pointer-events:none;transition:.3s;z-index:20}
.toast.on{opacity:1}
#modal{position:absolute;inset:0;background:rgba(2,6,23,.7);display:none;align-items:center;justify-content:center;z-index:30}
.mbox{background:var(--head);border:1px solid var(--bd);border-radius:16px;padding:22px;width:min(340px,92%);display:flex;flex-direction:column;gap:10px;backdrop-filter:blur(20px)}
.mbox .row{display:flex;gap:8px}.mbox .row input{flex:1}
.pv{width:84px;height:84px;border-radius:50%;align-self:center;background:#334155}
#nickErr{color:#f87171;min-height:16px;font-size:.78rem}
#sideBtn{display:none}
@media(max-width:700px){body{padding:6px}.app{height:96vh;border-radius:14px}.side{position:absolute;z-index:10;height:100%;transform:translateX(-100%);transition:.25s}.side.open{transform:none}#sideBtn{display:flex}.card{max-width:82%}.badge span{max-width:70px;overflow:hidden;text-overflow:ellipsis}}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<body>
<div class="app">
  <aside class="side" id="side">
    <h4>Odalar</h4>
    <div id="rooms"></div>
    <h4 id="onTitle">Çevrimiçi</h4>
    <div id="online"></div>
  </aside>
  <section class="chat">
    <div class="head">
      <div class="hl"><button class="ib" id="sideBtn">👥</button><div class="dot"></div><h2 id="roomTitle">Global Chat Room</h2></div>
      <div class="hr">
        <button class="ib" id="sndBtn" title="Bildirim sesi">🔊</button>
        <button class="ib" id="themeBtn" title="Tema">🌙</button>
        <button class="ib" id="clrBtn" title="Sohbeti bu ekrandan temizle">🧹</button>
        <div class="badge" id="meBadge"><img id="meAv" alt=""><span id="meNick">...</span></div>
      </div>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="sub" id="typing"></div>
    <div class="rbar" id="rbar"><span id="rtxt"></span><button class="ib" id="rx">✕</button></div>
    <div class="inbar">
      <div class="emo" id="emo"></div>
      <button class="ib" id="emoBtn">😊</button>
      <button class="ib" id="atBtn" title="Dosya / resim">📎</button>
      <input type="file" id="file" hidden>
      <input type="text" id="inp" placeholder="Mesajınızı yazın..." maxlength="200" disabled>
      <button id="sendBtn" disabled>Gönder</button>
    </div>
    <div class="toast" id="toast"></div>
  </section>
  <div id="modal">
    <div class="mbox">
      <h3>Profilini seç</h3>
      <img id="pv" class="pv" alt="">
      <input type="text" id="nickIn" maxlength="16" placeholder="Nick (2-16 karakter)">
      <div class="row"><input type="text" id="seedIn" maxlength="30" placeholder="Avatar tohumu (boşsa nick)"><button class="ib" id="dice" title="Rastgele">🎲</button></div>
      <small id="nickErr"></small>
      <div class="row"><button class="ib" id="cancelM" style="display:none">Vazgeç</button><button id="saveM" style="flex:1">Başla</button></div>
    </div>
  </div>
</div>

<script>
/* ---------- Kalıcı depolama (localStorage + cookie yedeği) ---------- */
const S={
  get(k){
    try{const v=localStorage.getItem(k);if(v!==null)return v}catch(e){}
    const m=document.cookie.match(new RegExp('(?:^|; )'+k+'=([^;]*)'));
    return m?decodeURIComponent(m[1]):null;
  },
  set(k,v){
    try{localStorage.setItem(k,v)}catch(e){}
    try{document.cookie=k+'='+encodeURIComponent(v)+';max-age=31536000;path=/;SameSite=Lax'}catch(e){}
  }
};

firebase.initializeApp({
  apiKey:"AIzaSyDC5cTxGvJq4Cc3dlkcD-QYfdUQPOOo4E8",
  authDomain:"message-site-329ee.firebaseapp.com",
  databaseURL:"https://message-site-329ee-default-rtdb.firebaseio.com",
  projectId:"message-site-329ee",
  storageBucket:"message-site-329ee.firebasestorage.app",
  messagingSenderId:"417292887136",
  appId:"1:417292887136:web:72a0d823dfa12f4969cf05",
  measurementId:"G-ZHRKD087KH"
});
const db=firebase.database(), st=firebase.storage();
const $=id=>document.getElementById(id);
const esc=t=>{const d=document.createElement('div');d.innerText=String(t==null?'':t);return d.innerHTML.replace(/"/g,'&quot;').replace(/'/g,'&#39;')};
const ROOMS={genel:'Genel',yazilim:'Yazılım',oyun:'Oyun'};
const EMOJIS='😀 😂 🤣 😊 😍 😘 😎 🤔 😅 😭 😡 🥳 😴 🤯 🙄 😏 👍 👎 👏 🙏 💪 🤝 👀 🔥 ❤️ 💔 ✨ 🎉 💀 💯 ✅ ❌ ⚽ 🎮 💻 🤖 🎧 🍕 ☕ 🌙 ⭐ 🚀 😇 🥲 😬 🤡 👻 🫡'.split(' ');
const REACTS=['👍','❤️','😂','😮','😢','🔥'];
const mpath=r=>r==='genel'?'messages':'messages_'+r;
const nk=n=>n.toLowerCase().replace(/[.#$\[\]\/]/g,'_');
const av=(s,f)=>`https://api.dicebear.com/7.x/avataaars/${f||'svg'}?seed=${encodeURIComponent(s)}`;

const devId=(()=>{let i=S.get('chat_device_id');if(!i){i='dev_'+Math.random().toString(36).slice(2,12)+Date.now().toString(36);S.set('chat_device_id',i)}return i})();
let me={nick:S.get('chat_nick')||'',seed:S.get('chat_seed')||''};
let room=ROOMS[S.get('chat_room')]?S.get('chat_room'):'genel';
let replyTo=null,lastSend=0,unread=0,lastTs=0,mref=null,tref=null,typingTimer=null,presInit=false,ac=null;
let sound=S.get('chat_sound')!=='0';
const data={};

/* ---------- Tema & ses ---------- */
function applyTheme(t){document.documentElement.dataset.theme=t;$('themeBtn').textContent=t==='dark'?'🌙':'☀️';S.set('chat_theme',t)}
applyTheme(S.get('chat_theme')||'dark');
$('themeBtn').onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
$('sndBtn').textContent=sound?'🔊':'🔇';
$('sndBtn').onclick=()=>{sound=!sound;S.set('chat_sound',sound?'1':'0');$('sndBtn').textContent=sound?'🔊':'🔇';if(sound)beep()};
function beep(){
  if(!sound)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();
    const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
    o.frequency.value=880;g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.25);
    o.start();o.stop(ac.currentTime+.25);
  }catch(e){}
}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}
function setTitle(){document.title=(unread?`(${unread}) `:'')+'Global Anlık Chat'}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){unread=0;setTitle()}});
window.addEventListener('focus',()=>{unread=0;setTitle()});

/* ---------- Profil / nick ---------- */
function updPv(){const n=$('nickIn').value.trim();$('pv').src=av($('seedIn').value.trim()||n||'chat')}
$('nickIn').oninput=updPv;$('seedIn').oninput=updPv;
$('dice').onclick=()=>{$('seedIn').value=Math.random().toString(36).slice(2,9);updPv()};
function openModal(){
  $('nickIn').value=me.nick;$('seedIn').value=me.seed&&me.seed!==me.nick?me.seed:'';
  $('nickErr').textContent='';$('cancelM').style.display=me.nick?'flex':'none';
  $('modal').style.display='flex';updPv();
}
$('meBadge').onclick=openModal;
$('cancelM').onclick=()=>$('modal').style.display='none';
async function claimNick(n){
  const r=await db.ref('nicks/'+nk(n)).transaction(v=>(v===null||v===devId)?devId:undefined);
  return r.committed;
}
$('saveM').onclick=async()=>{
  const n=$('nickIn').value.trim(),s=$('seedIn').value.trim()||n;
  if(n.length<2||n.length>16){$('nickErr').textContent='Nick 2-16 karakter olmalı';return}
  $('saveM').disabled=true;
  try{
    if(!(await claimNick(n))){$('nickErr').textContent='Bu nick alınmış, başka dene';return}
    if(me.nick&&nk(me.nick)!==nk(n))db.ref('nicks/'+nk(me.nick)).remove().catch(()=>{});
    me={nick:n,seed:s};S.set('chat_nick',n);S.set('chat_seed',s);
    $('modal').style.display='none';
    if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();
    enter();
  }catch(e){$('nickErr').textContent='Bağlantı hatası, tekrar dene'}
  finally{$('saveM').disabled=false}
};
function enter(){
  $('meNick').textContent=me.nick;$('meAv').src=av(me.seed||me.nick);
  $('inp').disabled=false;$('sendBtn').disabled=false;
  initPresence();joinRoom(room);
}

/* ---------- Odalar ---------- */
function drawRooms(){
  $('rooms').innerHTML=Object.entries(ROOMS).map(([k,v])=>`<button class="room${k===room?' on':''}" data-r="${k}">#${v}</button>`).join('');
  $('roomTitle').textContent='# '+ROOMS[room];
}
$('rooms').onclick=e=>{const b=e.target.closest('[data-r]');if(b&&b.dataset.r!==room){joinRoom(b.dataset.r);$('side').classList.remove('open')}};
$('sideBtn').onclick=()=>$('side').classList.toggle('open');

function joinRoom(r){
  if(mref)mref.off();if(tref)tref.off();
  db.ref(`typing/${room}/${devId}`).remove();
  room=r;S.set('chat_room',r);
  $('msgs').innerHTML='';$('typing').textContent='';lastTs=0;
  for(const k in data)delete data[k];
  setReply(null);drawRooms();setPresence();
  const cleared=+S.get('chat_clr_'+r)||0;
  let ready=false;
  mref=db.ref(mpath(r)).limitToLast(100);
  mref.once('value',()=>ready=true);
  mref.on('child_added',s=>{
    const d=s.val();if(!d||d.timestamp<=cleared)return;
    add(s.key,d);if(ready)notify(d);
  });
  mref.on('child_changed',s=>{const d=s.val();data[s.key]=d;const c=$('m_'+s.key);if(c)drawRx(c,d)});
  tref=db.ref('typing/'+r);
  tref.on('value',s=>{
    const n=Object.entries(s.val()||{}).filter(([k])=>k!==devId).map(([,v])=>v);
    $('typing').textContent=!n.length?'':n.length===1?`${n[0]} yazıyor...`:`${n.slice(0,2).join(', ')}${n.length>2?' ve diğerleri':''} yazıyor...`;
  });
}

/* ---------- Çevrimiçi listesi ---------- */
function setPresence(){if(presInit&&me.nick)db.ref('presence/'+devId).set({nick:me.nick,seed:me.seed||me.nick,room})}
function initPresence(){
  if(presInit)return;presInit=true;
  db.ref('.info/connected').on('value',s=>{
    if(!s.val())return;
    const r=db.ref('presence/'+devId);r.onDisconnect().remove();setPresence();
  });
  db.ref('presence').on('value',s=>{
    const list=Object.values(s.val()||{}).filter(u=>u.room===room);
    $('onTitle').textContent=`Çevrimiçi (${list.length})`;
    $('online').innerHTML=list.map(u=>`<div class="u"><img src="${av(u.seed||u.nick)}" alt=""><span>${esc(u.nick)}</span><i></i></div>`).join('');
  });
}

/* ---------- Mesaj render ---------- */
const fmtSize=b=>!b?'':b<1024*1024?(b/1024).toFixed(0)+' KB':(b/1048576).toFixed(1)+' MB';
function linkify(t){return esc(t).replace(/https?:\/\/[^\s<]+/g,u=>`<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`)}
function previews(t){
  const m=t.match(/https?:\/\/[^\s<>"']+/);if(!m)return'';
  const u=m[0];let h;try{h=new URL(u)}catch(e){return''}
  const yt=u.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{11})/);
  if(yt)return`<iframe class="yt" src="https://www.youtube.com/embed/${yt[1]}" allowfullscreen loading="lazy"></iframe>`;
  if(/\.(png|jpe?g|gif|webp|svg)(\?|$)/i.test(u))return`<img class="pimg" src="${esc(u)}" loading="lazy" alt="">`;
  return`<a class="lcard" href="${esc(u)}" target="_blank" rel="noopener noreferrer"><img src="https://www.google.com/s2/favicons?domain=${h.hostname}&sz=64" alt=""><div><b>${esc(h.hostname)}</b><small>${esc(u.slice(0,60))}</small></div></a>`;
}
function fileHtml(d){
  if(!d.fileUrl||!/^https:\/\//.test(d.fileUrl))return'';
  const u=esc(d.fileUrl);
  if((d.fileType||'').startsWith('image/'))return`<a href="${u}" target="_blank" rel="noopener"><img class="pimg" src="${u}" loading="lazy" alt=""></a>`;
  return`<a class="lcard" href="${u}" target="_blank" rel="noopener"><span class="fi">📎</span><div><b>${esc(d.fileName||'dosya')}</b><small>${fmtSize(d.fileSize)}</small></div></a>`;
}
function drawRx(c,d){
  c.querySelector('.rx').innerHTML=Object.entries(d.reactions||{}).map(([e,u])=>{
    const n=Object.keys(u||{}).length;
    return n?`<button class="chip${u[devId]?' on':''}" data-e="${esc(e)}">${esc(e)} ${n}</button>`:'';
  }).join('');
}
function add(id,d){
  data[id]=d;if(d.timestamp>lastTs)lastTs=d.timestamp;
  const mine=d.uid?d.uid===devId:d.username===me.nick;
  const m=$('msgs'),near=m.scrollHeight-m.scrollTop-m.clientHeight<160;
  const c=document.createElement('div');
  c.className='msg'+(mine?' mine':'');c.id='m_'+id;c.dataset.id=id;
  const t=new Date(d.timestamp).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});
  c.innerHTML=`<img class="av" src="${av(d.seed||d.username)}" alt=""><div class="card">
    <div class="mh"><b class="un">${esc(d.username)}</b><span class="tm">${t}</span></div>
    ${d.reply?`<div class="quote" data-q="${esc(d.reply.id)}"><b>${esc(d.reply.username)}</b>${esc(d.reply.text)}</div>`:''}
    ${d.text?`<div class="mt">${linkify(d.text)}</div>`:''}${fileHtml(d)}${previews(d.text||'')}
    <div class="rx"></div>
    <div class="acts"><button class="ib" data-a="reply" title="Yanıtla">↩️</button><button class="ib" data-a="react" title="Tepki">😊</button></div></div>`;
  drawRx(c,d);m.appendChild(c);
  if(near||mine||!m.dataset.init){m.scrollTop=m.scrollHeight}
  clearTimeout(m._i);m._i=setTimeout(()=>{m.dataset.init=1},800);
}

/* ---------- Tıklama olayları: yanıt, tepki, alıntı ---------- */
function closePop(){document.querySelectorAll('.rpop').forEach(p=>p.remove())}
function react(id,e){
  const r=db.ref(`${mpath(room)}/${id}/reactions/${e}/${devId}`);
  r.once('value',s=>s.val()?r.remove():r.set(true));
}
function setReply(o){
  replyTo=o;$('rbar').classList.toggle('on',!!o);
  if(o){$('rtxt').textContent=`↩️ ${o.username}: ${o.text}`;$('inp').focus()}
}
$('rx').onclick=()=>setReply(null);
$('msgs').addEventListener('click',e=>{
  const b=e.target.closest('button,.quote');if(!b)return;
  const c=b.closest('.msg');
  if(b.classList.contains('quote')){
    const t=$('m_'+b.dataset.q);
    if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.add('flash');setTimeout(()=>t.classList.remove('flash'),1200)}
    return;
  }
  const id=c.dataset.id,d=data[id];
  if(b.dataset.e){react(id,b.dataset.e);closePop();return}
  if(b.dataset.a==='reply'){setReply({id,username:d.username,text:(d.text||d.fileName||'📎 dosya').slice(0,80)})}
  if(b.dataset.a==='react'){
    const had=c.querySelector('.rpop');closePop();if(had)return;
    const p=document.createElement('div');p.className='rpop';
    p.innerHTML=REACTS.map(x=>`<button data-e="${x}">${x}</button>`).join('');
    c.querySelector('.acts').appendChild(p);
  }
});
document.addEventListener('click',e=>{
  if(!e.target.closest('.acts'))closePop();
  if(!e.target.closest('#emo,#emoBtn'))$('emo').classList.remove('on');
});

/* ---------- Gönderme / spam koruması ---------- */
function send(extra){
  const text=$('inp').value.trim();
  if(!text&&!extra)return;
  const now=Date.now();
  if(now-lastSend<2000){toast('Çok hızlısın, 2 saniyede 1 mesaj');return false}
  lastSend=now;
  const o={username:me.nick,uid:devId,seed:me.seed||me.nick,text,timestamp:firebase.database.ServerValue.TIMESTAMP,...extra};
  if(replyTo)o.reply=replyTo;
  db.ref(mpath(room)).push(o);
  $('inp').value='';setReply(null);
  clearTimeout(typingTimer);db.ref(`typing/${room}/${devId}`).remove();
  if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();
  return true;
}
$('sendBtn').onclick=()=>send();
$('inp').addEventListener('keypress',e=>{if(e.key==='Enter')send()});

/* ---------- Yazıyor... ---------- */
$('inp').addEventListener('input',()=>{
  if(!me.nick)return;
  const r=db.ref(`typing/${room}/${devId}`);
  r.onDisconnect().remove();r.set(me.nick);
  clearTimeout(typingTimer);typingTimer=setTimeout(()=>r.remove(),2500);
});

/* ---------- Emoji paneli ---------- */
$('emo').innerHTML=EMOJIS.map(x=>`<button>${x}</button>`).join('');
$('emoBtn').onclick=()=>$('emo').classList.toggle('on');
$('emo').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  const i=$('inp'),s=i.selectionStart==null?i.value.length:i.selectionStart;
  if(i.value.length+b.textContent.length>i.maxLength)return;
  i.value=i.value.slice(0,s)+b.textContent+i.value.slice(i.selectionEnd==null?s:i.selectionEnd);
  i.focus();i.setSelectionRange(s+b.textContent.length,s+b.textContent.length);
};

/* ---------- Dosya / resim yükleme (Firebase Storage) ---------- */
$('atBtn').onclick=()=>$('file').click();
$('file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  if(f.size>5*1024*1024){toast('Dosya en fazla 5 MB olabilir');return}
  if(Date.now()-lastSend<2000){toast('Çok hızlısın, 2 saniyede 1 mesaj');return}
  toast('Yükleniyor...');$('atBtn').disabled=true;
  try{
    const ref=st.ref(`uploads/${room}/${Date.now()}_${f.name.replace(/[^\w.-]/g,'_')}`);
    await ref.put(f);
    const url=await ref.getDownloadURL();
    send({fileUrl:url,fileName:f.name,fileType:f.type||'',fileSize:f.size});
  }catch(err){toast('Yükleme başarısız (Storage kurallarını kontrol et)')}
  finally{$('atBtn').disabled=false}
};

/* ---------- Bildirimler ---------- */
function notify(d){
  if(d.uid===devId||(!d.uid&&d.username===me.nick))return;
  if(document.hidden){
    unread++;setTitle();
    if('Notification' in window&&Notification.permission==='granted'){
      try{new Notification(`${d.username} · #${ROOMS[room]}`,{body:(d.text||'📎 dosya').slice(0,100),icon:av(d.seed||d.username,'png')})}catch(e){}
    }
  }
  beep();
}

/* ---------- Yerel temizleme ---------- */
$('clrBtn').onclick=()=>{
  if(!confirm('Bu odadaki sohbet sadece senin ekranından temizlensin mi?'))return;
  S.set('chat_clr_'+room,lastTs||Date.now());
  $('msgs').innerHTML='';
};

/* ---------- Başlat ---------- */
window.addEventListener('load',()=>{ me.nick?enter():openModal() });
drawRooms();
</script>
</body>
</html>
