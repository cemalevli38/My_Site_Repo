<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Anlık Chat</title>
    <!-- Favicon Icon + Dynamic Cache Busting -->
    <link id="favicon" rel="icon" type="image/png" href="">
    <script>
        document.getElementById('favicon').href = "https://wsrv.nl/?url=https://github.com/cemalevli38.png&w=200&h=200&mask=circle&t=" + new Date().getTime();
    </script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: radial-gradient(circle at top left, #0f172a, #020617);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        /* Ambient Background Elements */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: #38bdf8;
            filter: blur(150px);
            opacity: 0.15;
            top: 10%;
            left: 15%;
            z-index: 0;
            border-radius: 50%;
        }

        body::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: #818cf8;
            filter: blur(160px);
            opacity: 0.12;
            bottom: 10%;
            right: 15%;
            z-index: 0;
            border-radius: 50%;
        }

        .chat-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 750px;
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4),
                        0 0 40px rgba(56, 189, 248, 0.05);
            display: flex;
            flex-direction: column;
            height: 85vh;
            overflow: hidden;
        }

        .chat-header {
            background: rgba(15, 23, 42, 0.6);
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .chat-header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .chat-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-badge {
            font-size: 0.85rem;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .user-badge span {
            color: #38bdf8;
            font-weight: 600;
        }

        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .message-card {
            background: rgba(51, 65, 85, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px 16px;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            max-width: 75%;
            word-wrap: break-word;
            align-self: flex-start;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.25s ease-out forwards;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .message-card:hover {
            background: rgba(51, 65, 85, 0.6);
        }

        /* Kullanıcının kendi mesajları için stil */
        .message-card.my-message {
            align-self: flex-end;
            border-radius: 16px;
            border-bottom-right-radius: 4px;
            background: linear-gradient(135deg, rgba(2, 132, 199, 0.4), rgba(99, 102, 241, 0.4));
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            margin-bottom: 6px;
            gap: 12px;
        }

        .username {
            font-weight: 600;
            color: #38bdf8;
            letter-spacing: 0.3px;
        }

        .my-message .username {
            color: #a5f3fc;
        }

        .time {
            color: #64748b;
            font-size: 0.7rem;
        }

        .message-text {
            font-size: 0.92rem;
            line-height: 1.5;
            color: #f1f5f9;
            font-weight: 400;
        }

        .chat-input-area {
            padding: 20px 24px;
            background: rgba(15, 23, 42, 0.7);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-row {
            display: flex;
            gap: 12px;
        }

        input[type="text"] {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f8fafc;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]::placeholder {
            color: #64748b;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
            background: rgba(30, 41, 59, 0.9);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
        }

        #messageInput {
            flex: 1;
        }

        button {
            background: linear-gradient(135deg, #0284c7, #4f46e5);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.35);
            background: linear-gradient(135deg, #0369a1, #4338ca);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .chat-container { height: 92vh; border-radius: 16px; }
            .message-card { max-width: 88%; }
        }
    </style>
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="chat-header-title">
            <div class="status-dot"></div>
            <h2>Global Chat Room</h2>
        </div>
        <div class="user-badge">İsminiz: <span id="displayUsername">Yükleniyor...</span></div>
    </div>
    
    <div class="chat-messages" id="chatMessages"></div>

    <div class="chat-input-area">
        <div class="input-row">
            <input type="text" id="messageInput" placeholder="Mesajınızı yazın..." maxlength="200" disabled>
            <button id="sendBtn" onclick="sendMessage()" disabled>
                <span>Gönder</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>
</div>

<script>
    // Firebase Konfigürasyonu
    const firebaseConfig = {
        apiKey: "AIzaSyDC5cTxGvJq4Cc3dlkcD-QYfdUQPOOo4E8",
        authDomain: "message-site-329ee.firebaseapp.com",
        databaseURL: "https://message-site-329ee-default-rtdb.firebaseio.com",
        projectId: "message-site-329ee",
        storageBucket: "message-site-329ee.firebasestorage.app",
        messagingSenderId: "417292887136",
        appId: "1:417292887136:web:72a0d823dfa12f4969cf05",
        measurementId: "G-ZHRKD087KH"
    };

    // Firebase Başlatma
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const messagesRef = db.ref('messages');
    const deviceUsersRef = db.ref('device_users');
    const takenUsernamesRef = db.ref('taken_usernames');

    // Sabit İsim Havuzu
    const availableNames = [
        "Astra", "Blaze", "Cipher", "Drift", "Echo", "Falcon", "Ghost", "Hyper",
        "Impulse", "Jolt", "Krypton", "Lunar", "Matrix", "Nova", "Onyx", "Phantom",
        "Quantum", "Rogue", "Shadow", "Titan", "Ultra", "Vortex", "Wraith", "Xenon",
        "Zenith", "Apex", "Bolt", "Cobalt", "Dynamo", "Eclipse", "Frost", "Giga"
    ];

    let currentUsername = "";

    // Cihaz Bazlı Benzersiz ID Üretme / Çekme
    function getDeviceId() {
        let deviceId = localStorage.getItem('chat_device_id');
        if (!deviceId) {
            deviceId = 'dev_' + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
            localStorage.setItem('chat_device_id', deviceId);
        }
        return deviceId;
    }

    // Atomik İşlem (Transaction) ile Çakışmasız İsim Atama
    async function initUser() {
        const deviceId = getDeviceId();
        
        // Bu cihaz için daha önce bir isim atanmış mı kontrol et
        const deviceSnapshot = await deviceUsersRef.child(deviceId).once('value');
        let assignedName = deviceSnapshot.val();

        if (assignedName) {
            currentUsername = assignedName;
        } else {
            // Firebase Transaction ile güvenli isim alma
            await takenUsernamesRef.transaction((takenData) => {
                let takenObj = takenData || {};
                let takenList = Object.values(takenObj);

                let freeNames = availableNames.filter(name => !takenList.includes(name));
                let selectedName = "";

                if (freeNames.length === 0) {
                    selectedName = "User_" + Math.floor(1000 + Math.random() * 9000);
                } else {
                    let randomIndex = Math.floor(Math.random() * freeNames.length);
                    selectedName = freeNames[randomIndex];
                }

                currentUsername = selectedName;
                takenObj[Date.now() + '_' + Math.random().toString(36).substring(2, 7)] = selectedName;
                return takenObj;
            });

            // Cihaza ismi kaydet
            await deviceUsersRef.child(deviceId).set(currentUsername);
        }

        // Arayüzü güncelle ve inputları aktif et
        document.getElementById('displayUsername').innerText = currentUsername;
        document.getElementById('messageInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;

        // Mesajları dinlemeye başla
        listenForMessages();
    }

    window.addEventListener('load', () => {
        initUser();
    });

    // Anlık Mesajları Dinle
    function listenForMessages() {
        messagesRef.limitToLast(50).on('child_added', (snapshot) => {
            const data = snapshot.val();
            renderMessage(data);
        });
    }

    // Ekrana Mesaj Ekleme
    function renderMessage(data) {
        const chatMessages = document.getElementById('chatMessages');
        const card = document.createElement('div');
        
        // Kendi mesajımız ise sağa hizala ve özel stil ver
        const isMyMessage = data.username === currentUsername;
        card.className = `message-card ${isMyMessage ? 'my-message' : ''}`;
        
        const timeStr = new Date(data.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });

        card.innerHTML = `
            <div class="message-header">
                <span class="username">${escapeHtml(data.username)}</span>
                <span class="time">${timeStr}</span>
            </div>
            <div class="message-text">${escapeHtml(data.text)}</div>
        `;

        chatMessages.appendChild(card);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // Mesaj Gönderme Fonksiyonu
    function sendMessage() {
        const messageInput = document.getElementById('messageInput');
        const text = messageInput.value.trim();

        if (!text || !currentUsername) {
            return;
        }

        // Firebase'e Ekle
        messagesRef.push({
            username: currentUsername,
            text: text,
            timestamp: firebase.database.ServerValue.TIMESTAMP
        });

        // Temizle
        messageInput.value = '';
    }

    // Enter tuşu ile gönderme
    document.getElementById('messageInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });

    // XSS Koruması
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.innerText = text;
        return div.innerHTML;
    }
</script>

</body>
</html>
