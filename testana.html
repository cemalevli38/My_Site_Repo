<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="7ZKGIUgvQFxMqSWI9xBMea2VWjHf21anbsiAN4X3O34" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cemal Evli | Nexus Portal</title>
    <link id="favicon" rel="icon" type="image/x-icon" href="https://wsrv.nl/?url=https://github.com/cemalevli38.png&w=64&h=64&mask=circle&output=png">
    
    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-base: #030712;
            --bg-surface: rgba(17, 24, 39, 0.4);
            --bg-surface-hover: rgba(31, 41, 55, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(56, 189, 248, 0.3);
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            
            --accent-cyan: #38bdf8;
            --accent-glow-cyan: rgba(56, 189, 248, 0.25);
            
            --accent-pink: #f472b6;
            --accent-glow-pink: rgba(244, 114, 182, 0.25);
            
            --accent-purple: #c084fc;
            --accent-glow-purple: rgba(192, 132, 252, 0.25);

            --shadow-card: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            --glass-blur: blur(16px);
        }

        .light {
            --bg-base: #f8fafc;
            --bg-surface: rgba(255, 255, 255, 0.65);
            --bg-surface-hover: rgba(255, 255, 255, 0.9);
            --border-color: rgba(0, 0, 0, 0.06);
            --border-highlight: rgba(2, 132, 199, 0.3);
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            
            --accent-cyan: #0284c7;
            --accent-glow-cyan: rgba(2, 132, 199, 0.15);
            
            --accent-pink: #db2777;
            --accent-glow-pink: rgba(219, 39, 119, 0.15);
            
            --accent-purple: #7c3aed;
            --accent-glow-purple: rgba(124, 58, 237, 0.15);

            --shadow-card: 0 10px 30px -10px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-base);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding-bottom: 60px;
        }

        /* Banner */
        .info-banner {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-150%);
            background: var(--bg-surface);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-highlight);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: 99px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 2000;
            font-size: 0.875rem;
            font-weight: 500;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            opacity: 0;
        }

        .info-banner.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .info-banner button {
            background: var(--accent-cyan);
            border: none;
            padding: 6px 16px;
            border-radius: 99px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 700;
            color: #030712;
        }

        .info-banner button:hover {
            transform: scale(1.05);
        }

        /* Header Navigation Container */
        .header-wrapper {
            width: 100%;
            max-width: 1000px;
            padding: 40px 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .brand-profile {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .avatar-container {
            position: relative;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: var(--bg-base);
        }

        .brand-info h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .light .brand-info h1 {
            background: linear-gradient(135deg, #0f172a 0%, #475569 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-info p {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Controls / Actions */
        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box i {
            position: absolute;
            left: 16px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            pointer-events: none;
        }

        input#search {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px 16px 12px 42px;
            border-radius: 16px;
            outline: none;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            width: 260px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        input#search:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px var(--accent-glow-cyan);
            width: 290px;
        }

        .icon-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            height: 46px;
            padding: 0 16px;
            border-radius: 16px;
            cursor: pointer;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            font-weight: 600;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn:hover {
            border-color: var(--accent-cyan);
            background: var(--bg-surface-hover);
            transform: translateY(-2px);
        }

        /* Language Dropdown */
        .lang-switcher { position: relative; }
        .lang-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            overflow: hidden;
            min-width: 150px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            z-index: 100;
        }

        .lang-switcher.open .lang-dropdown {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .lang-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-primary);
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .lang-option:hover {
            background: var(--bg-surface-hover);
            color: var(--accent-cyan);
        }

        /* Layout Sections */
        .content-container {
            width: 100%;
            max-width: 1000px;
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .section-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .section-title i {
            color: var(--accent-cyan);
            font-size: 1.1rem;
        }
        
        .section-title.games i { color: var(--accent-pink); }
        .section-title.files i { color: var(--accent-purple); }

        /* Grid System */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 20px;
            width: 100%;
        }

        /* Modern Modernized Cards */
        .project-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 24px;
            text-decoration: none;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 16px;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-card);
        }

        .project-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .project-card:hover {
            transform: translateY(-4px) scale(1.01);
            background: var(--bg-surface-hover);
            border-color: var(--accent-cyan);
            box-shadow: 0 15px 35px var(--accent-glow-cyan);
        }

        .project-card.game-card:hover {
            border-color: var(--accent-pink);
            box-shadow: 0 15px 35px var(--accent-glow-pink);
        }

        .project-card.file-card:hover {
            border-color: var(--accent-purple);
            box-shadow: 0 15px 35px var(--accent-glow-purple);
        }

        .icon-wrapper {
            width: 52px;
            height: 52px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            font-size: 1.25rem;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-cyan);
            border: 1px solid rgba(56, 189, 248, 0.15);
        }

        .game-card .icon-wrapper {
            background: rgba(244, 114, 182, 0.1);
            color: var(--accent-pink);
            border-color: rgba(244, 114, 182, 0.15);
        }

        .file-card .icon-wrapper {
            background: rgba(192, 132, 252, 0.1);
            color: var(--accent-purple);
            border-color: rgba(192, 132, 252, 0.15);
        }

        .info-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .name {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tag-sub {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .action-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .project-card:hover .action-icon {
            background: var(--accent-cyan);
            color: #030712;
        }

        .game-card:hover .action-icon {
            background: var(--accent-pink);
            color: #030712;
        }

        .file-card:hover .action-icon {
            background: var(--accent-purple);
            color: #030712;
        }

        /* Glassmorphic Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(3, 7, 18, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 32px;
            padding: 32px;
            width: 100%;
            max-width: 550px;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: scale(0.9) translateY(20px);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-header h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: rotate(90deg);
        }

        .file-list {
            max-height: 320px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 4px;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            gap: 12px;
        }

        .light .file-item {
            background: rgba(255, 255, 255, 0.5);
        }

        .download-btn {
            background: var(--accent-cyan);
            color: #030712;
            padding: 8px 16px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .game-card-modal .download-btn { background: var(--accent-pink); }
        .file-card-modal .download-btn { background: var(--accent-purple); }

        .alt-links-section {
            margin-top: 20px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed var(--border-color);
            border-radius: 20px;
        }

        .alt-link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 0.875rem;
        }

        .hidden { display: none !important; }

        /* Footer */
        footer {
            margin-top: auto;
            padding-top: 60px;
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        footer b {
            color: var(--text-primary);
        }

        /* Scrollbar styles */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }
    </style>
</head>
<body id="main-body">

<div id="infoBanner" class="info-banner">
    <i class="fa-solid fa-circle-info" style="color: var(--accent-cyan);"></i>
    <span id="bannerText"></span>
    <button id="bannerBtn" onclick="closeBanner()"></button>
</div>

<div class="header-wrapper">
    <header>
        <div class="brand-profile">
            <div class="avatar-container">
                <img id="profileImg" src="https://wsrv.nl/?url=https://github.com/cemalevli38.png&w=100&h=100&mask=circle&output=png" alt="Cemal Evli">
            </div>
            <div class="brand-info">
                <h1>Cemal Evli</h1>
                <p id="profileSub">Developer & Cyber Enthusiast</p>
            </div>
        </div>

        <div class="controls">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input id="search" placeholder="">
            </div>

            <div class="lang-switcher" id="langSwitcher">
                <button class="icon-btn" id="langBtn">
                    <i class="fa-solid fa-globe"></i>
                    <span id="langLabel"></span>
                    <i class="fa-solid fa-chevron-down" style="font-size: 0.7rem;"></i>
                </button>
                <div class="lang-dropdown">
                    <button class="lang-option" data-lang="en">🇬🇧 English</button>
                    <button class="lang-option" data-lang="tr">🇹🇷 Türkçe</button>
                </div>
            </div>

            <button id="themeToggle" class="icon-btn" aria-label="Toggle Theme">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>
</div>

<div class="content-container">
    <div id="projects-section">
        <div class="section-header">
            <h2 class="section-title"><i class="fa-solid fa-folder-open"></i> <span id="projectsTitle"></span></h2>
        </div>
        <div id="project-container" class="grid"></div>
    </div>

    <div id="games-section" class="hidden">
        <div class="section-header">
            <h2 class="section-title games"><i class="fa-solid fa-gamepad"></i> <span id="gamesTitle"></span></h2>
        </div>
        <div id="game-container" class="grid"></div>
    </div>

    <div id="files-section" class="hidden">
        <div class="section-header">
            <h2 class="section-title files"><i class="fa-solid fa-box-archive"></i> <span id="filesTitle"></span></h2>
        </div>
        <div id="files-container" class="grid"></div>
    </div>
</div>

<div id="gameFilesModal" class="modal-overlay">
    <div class="modal-content" id="modalContentWrapper">
        <div class="modal-header">
            <h2 id="modalGameName"></h2>
            <button class="close-btn" onclick="toggleModal('gameFilesModal', false)"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="fileContainer" class="file-list"></div>
        <div id="altLinksContainer" class="alt-links-section hidden">
            <div style="font-weight: 700; font-size: 0.8rem; color: var(--accent-cyan); margin-bottom: 8px;" id="altTitle"></div>
            <div id="altLinksList"></div>
        </div>
    </div>
</div>

<footer>
    <p id="footerText"></p>
</footer>

<script>
const currentTimestamp = new Date().getTime();
document.getElementById("favicon").href = `https://wsrv.nl/?url=https://github.com/cemalevli38.png&w=64&h=64&mask=circle&output=png&v=${currentTimestamp}`;
document.getElementById("profileImg").src = `https://wsrv.nl/?url=https://github.com/cemalevli38.png&w=100&h=100&mask=circle&output=png&v=${currentTimestamp}`;

const bodyEl = document.getElementById("main-body");
if (bodyEl) {
    bodyEl.style.backgroundImage = `url('https://raw.githubusercontent.com/cemalevli38/My_Site_Repo/refs/heads/main/background.avif?v=${currentTimestamp}')`;
}

const PROJECTS_DATA_URL = "https://raw.githubusercontent.com/cemalevli38/My_Site_Repo/refs/heads/main/projects.json"; 
const GAMES_DATA_URL = "https://raw.githubusercontent.com/cemalevli38/My_Site_Repo/refs/heads/main/games.json";
const FILES_DATA_URL = "https://raw.githubusercontent.com/cemalevli38/My_Site_Repo/refs/heads/main/files.json";

const TRANSLATIONS = {
    en: {
        profileSub: "Developer & Cyber Enthusiast",
        searchPlaceholder: "Search projects, games...",
        projectsTitle: "Web Projects",
        gamesTitle: "Game Vault",
        filesTitle: "Downloads & Files",
        webAppSub: "Web Application",
        cloudMirror: "Cloud Mirror",
        loading: "Loading...",
        error: "Data unavailable.",
        noFiles: "No files found.",
        downloadBtn: "Download",
        altLinkBtn: "Mirror",
        altTitle: "ALTERNATIVE MIRRORS",
        footerText: 'Designed & Built by <a href="https://github.com/cemalevli38" target="_blank" style="text-decoration:none; color:inherit;"><b>Cemal Evli</b></a> &copy; 2026',
        langLabel: "EN",
        updateNotice: "Data syncs automatically every hour.",
        bannerConfirm: "Got it"
    },
    tr: {
        profileSub: "Geliştirici & Siber Güvenlik Meraklısı",
        searchPlaceholder: "Proje veya oyun ara...",
        projectsTitle: "Web Projeleri",
        gamesTitle: "Oyun Arşivi",
        filesTitle: "Dosyalar & İndirmeler",
        webAppSub: "Web Uygulaması",
        cloudMirror: "Bulut Aynası",
        loading: "Yükleniyor...",
        error: "Veriler yüklenemedi.",
        noFiles: "Dosya bulunamadı.",
        downloadBtn: "İndir",
        altLinkBtn: "Alternatif",
        altTitle: "ALTERNATİF LİNKLER",
        footerText: '<a href="https://github.com/cemalevli38" target="_blank" style="text-decoration:none; color:inherit;"><b>Cemal Evli</b></a> tarafından tasarlandı &copy; 2026',
        langLabel: "TR",
        updateNotice: "Sitedeki veriler her saat başı otomatik güncellenir.",
        bannerConfirm: "Anlaşıldı"
    }
};

let currentLang = localStorage.getItem("lang") || "en";
function tr(key) { return TRANSLATIONS[currentLang][key] || TRANSLATIONS["en"][key]; }

function applyLanguage() {
    document.documentElement.lang = currentLang;
    document.getElementById("profileSub").textContent = tr("profileSub");
    document.getElementById("search").placeholder = tr("searchPlaceholder");
    document.getElementById("projectsTitle").textContent = tr("projectsTitle");
    document.getElementById("gamesTitle").textContent = tr("gamesTitle");
    document.getElementById("filesTitle").textContent = tr("filesTitle");
    document.getElementById("footerText").innerHTML = tr("footerText");
    document.getElementById("langLabel").textContent = tr("langLabel");
    document.getElementById("bannerText").textContent = tr("updateNotice");
    document.getElementById("bannerBtn").textContent = tr("bannerConfirm");
    document.getElementById("altTitle").textContent = tr("altTitle");
    
    loadProjects();
    loadGames();
    loadFiles();
}

function checkBanner() { 
    if (!localStorage.getItem("bannerClosed")) {
        setTimeout(() => document.getElementById("infoBanner").classList.add("show"), 800); 
    }
}

function closeBanner() { 
    document.getElementById("infoBanner").classList.remove("show"); 
    localStorage.setItem("bannerClosed", "true"); 
}

const themeToggleBtn = document.getElementById('themeToggle');
if (localStorage.getItem("theme") === "light") {
    document.body.classList.add("light");
    themeToggleBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
}

themeToggleBtn.onclick = () => {
    document.body.classList.toggle("light");
    const isLight = document.body.classList.contains("light");
    themeToggleBtn.innerHTML = isLight ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
    localStorage.setItem("theme", isLight ? "light" : "dark");
};

const norm = s => !s ? "" : s.toLowerCase().replace(/ı/g, 'i').replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ş/g, 's').replace(/ö/g, 'o').replace(/ç/g, 'c').normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[_\s-]/g, "");

function toggleModal(id, show) {
    const m = document.getElementById(id);
    if (m) {
        m.classList.toggle('active', show);
        document.body.style.overflow = show ? 'hidden' : 'auto';
    }
}

async function loadProjects() {
    const container = document.getElementById("project-container");
    const section = document.getElementById("projects-section");
    try {
        const res = await fetch(PROJECTS_DATA_URL);
        const items = await res.json();
        if(!items || items.length === 0) { section.classList.add("hidden"); return; }
        
        section.classList.remove("hidden");
        container.innerHTML = "";
        items.filter(i => i.type === "dir" && i.name !== ".github" ).forEach(p => {
            const card = document.createElement("a");
            card.className = "project-card";
            card.href = p.path;
            card.target = "_blank";
            card.dataset.searchName = norm(p.name);
            card.innerHTML = `
                <div class="icon-wrapper"><i class="fa-solid fa-globe"></i></div>
                <div class="info-group">
                    <div class="name">${p.name.replace(/_/g, " ")}</div>
                    <div class="tag-sub">${tr("webAppSub")}</div>
                </div>
                <div class="action-icon"><i class="fa-solid fa-arrow-up-right-from-square"></i></div>
            `;
            container.appendChild(card);
        });
    } catch (e) { section.classList.add("hidden"); }
}

async function loadGames() {
    const container = document.getElementById("game-container");
    const section = document.getElementById("games-section");
    try {
        const res = await fetch(GAMES_DATA_URL);
        const releases = await res.json();
        if(!releases || releases.length === 0) { section.classList.add("hidden"); return; }

        section.classList.remove("hidden");
        container.innerHTML = "";
        releases.forEach(rel => {
            const card = document.createElement("div");
            card.className = "project-card game-card";
            card.dataset.searchName = norm(rel.name || rel.tag_name);
            card.innerHTML = `
                <div class="icon-wrapper"><i class="fa-solid fa-gamepad"></i></div>
                <div class="info-group">
                    <div class="name">${rel.name || rel.tag_name}</div>
                    <div class="tag-sub">${rel.tag_name}</div>
                </div>
                <div class="action-icon"><i class="fa-solid fa-download"></i></div>
            `;
            card.onclick = () => openGameModal(rel, "game");
            container.appendChild(card);
        });
    } catch (e) { section.classList.add("hidden"); }
}

async function loadFiles() {
    const container = document.getElementById("files-container");
    const section = document.getElementById("files-section");
    try {
        const res = await fetch(FILES_DATA_URL);
        const files = await res.json();
        if(!files || files.length === 0) { section.classList.add("hidden"); return; }

        section.classList.remove("hidden");
        container.innerHTML = "";
        files.forEach(file => {
            const card = document.createElement("div");
            card.className = "project-card file-card";
            card.dataset.searchName = norm(file.name || file.tag_name);
            card.innerHTML = `
                <div class="icon-wrapper"><i class="fa-solid fa-box-archive"></i></div>
                <div class="info-group">
                    <div class="name">${file.name || file.tag_name}</div>
                    <div class="tag-sub">${file.tag_name}</div>
                </div>
                <div class="action-icon"><i class="fa-solid fa-download"></i></div>
            `;
            card.onclick = () => openGameModal(file, "file");
            container.appendChild(card);
        });
    } catch (e) { section.classList.add("hidden"); }
}

function openGameModal(rel, category) {
    const fileContainer = document.getElementById("fileContainer");
    const altContainer = document.getElementById("altLinksContainer");
    const altList = document.getElementById("altLinksList");
    const modalWrapper = document.getElementById("modalContentWrapper");
    
    modalWrapper.className = "modal-content " + (category === "game" ? "game-card-modal" : "file-card-modal");
    document.getElementById("modalGameName").textContent = rel.name || rel.tag_name;
    
    fileContainer.innerHTML = "";
    altList.innerHTML = "";
    altContainer.classList.add("hidden");

    if (rel.assets && rel.assets.length > 0) {
        rel.assets.forEach(asset => {
            const div = document.createElement("div");
            div.className = "file-item";
            const size = (asset.size / (1024 * 1024)).toFixed(2);
            div.innerHTML = `
                <div style="display:flex; gap:12px; align-items:center; min-width:0;">
                    <i class="${getFileIconClass(asset.name)}" style="font-size:1.2rem; color:var(--text-secondary);"></i>
                    <div style="min-width:0;">
                        <div style="font-weight:700; font-size:0.875rem; word-break:break-all;">${asset.name}</div>
                        <div style="font-size:0.75rem; color:var(--text-secondary); margin-top:2px;">${size} MB</div>
                    </div>
                </div>
                <a href="${asset.browser_download_url}" class="download-btn" target="_blank"><i class="fa-solid fa-arrow-down"></i> ${tr("downloadBtn")}</a>
            `;
            fileContainer.appendChild(div);
        });
    } else {
        fileContainer.innerHTML = `<p style='padding:20px; color:var(--text-secondary); text-align:center;'>${tr("noFiles")}</p>`;
    }

    if (rel.alt_links && rel.alt_links.length > 0) {
        altContainer.classList.remove("hidden");
        rel.alt_links.forEach(link => { addAltLinkRow(link.name, link.url); });
    } 
    else if (rel.body && rel.body.trim().startsWith("http")) {
        altContainer.classList.remove("hidden");
        addAltLinkRow(tr("cloudMirror"), rel.body.trim());
    }

    function addAltLinkRow(label, url) {
        const div = document.createElement("div");
        div.className = "alt-link-item";
        div.innerHTML = `
            <span style="font-weight:600;">${label}</span>
            <a href="${url}" class="download-btn" style="background:var(--bg-surface-hover); color:var(--text-primary);" target="_blank">${tr("altLinkBtn")} <i class="fa-solid fa-up-right-from-square" style="font-size:0.7rem;"></i></a>
        `;
        altList.appendChild(div);
    }

    toggleModal('gameFilesModal', true);
}

function getFileIconClass(fn) {
    const ext = fn.split('.').pop().toLowerCase();
    const map = {
        'zip': 'fa-solid fa-file-zipper',
        'rar': 'fa-solid fa-file-zipper',
        'apk': 'fa-brands fa-android',
        'exe': 'fa-solid fa-gears',
        'pdf': 'fa-solid fa-file-pdf',
        'mp4': 'fa-solid fa-file-video',
        'mp3': 'fa-solid fa-file-audio'
    };
    return map[ext] || 'fa-solid fa-file';
}

document.getElementById('search').addEventListener("input", function () {
    const q = norm(this.value);
    document.querySelectorAll(".project-card").forEach(card => {
        card.classList.toggle("hidden", !card.dataset.searchName.includes(q));
    });
});

document.getElementById("langBtn").onclick = (e) => { 
    e.stopPropagation(); 
    document.getElementById("langSwitcher").classList.toggle("open"); 
};

document.querySelectorAll(".lang-option").forEach(btn => {
    btn.onclick = () => {
        currentLang = btn.dataset.lang;
        localStorage.setItem("lang", currentLang);
        document.getElementById("langSwitcher").classList.remove("open");
        applyLanguage();
    };
});

window.onclick = (e) => {
    if (e.target.classList.contains('modal-overlay')) toggleModal(e.target.id, false);
    if (!document.getElementById("langSwitcher").contains(e.target)) document.getElementById("langSwitcher").classList.remove("open");
};

applyLanguage();
checkBanner();
</script>
</body>
</html>
